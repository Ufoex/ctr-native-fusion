name: Build and Release

on:
  push:
    branches: [ "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Google removed the legacy 'tools' package from the SDK repo;
          # the action still requests it by default and fails licensing.
          packages: platform-tools

      - name: Instalar SDK, NDK e CMake
        shell: bash
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.3.11579264"

      - name: Conceder permissão ao Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Compilar APK Release
        working-directory: android
        env:
          ANDROID_NDK_VERSION: 26.3.11579264
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Renombrar APK
        run: cp android/app/build/outputs/apk/release/app-release.apk CTR-Fusion-android.apk

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CTR-Fusion-android.apk
          path: CTR-Fusion-android.apk
          if-no-files-found: error
          retention-days: 14

  build-pc:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # allow_failure: this leg's apt install used to pull in
          # libpulse-dev:i386 -> libglib2.0-dev:i386, and Ubuntu's i386
          # archive has occasionally lagged behind amd64 on the exact
          # libglib2.0-dev-bin:i386 build that version demands (an upstream
          # mirror skew, not anything this repo controls). Dropping
          # libpulse-dev:i386 below avoids that specific chain; true stays
          # here as a safety net for any other such skew, so it can't block
          # the release the other three platforms are ready for.
          - name: Linux x86 (32-bit)
            os: ubuntu-24.04
            force32: "ON"
            artifact: ctr_native
            allow_failure: true
          - name: Linux x86-64 (64-bit)
            os: ubuntu-24.04
            force32: "OFF"
            artifact: ctr_native
            allow_failure: false
          - name: Windows x86 (32-bit, MSVC)
            os: windows-latest
            msvc_arch: Win32
            force32: "ON"
            artifact: ctr_native.exe
            allow_failure: false
          - name: Windows x64 (64-bit, MSVC)
            os: windows-latest
            msvc_arch: x64
            force32: "OFF"
            artifact: ctr_native.exe
            allow_failure: false

    continue-on-error: ${{ matrix.allow_failure }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Instalar dependencias (Linux, 64-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'OFF'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev \
            libxkbcommon-dev libgl1-mesa-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libwayland-dev libdecor-0-dev

      - name: Instalar dependencias (Linux, 32-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'ON'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # No libpulse-dev:i386 here: it depends on libglib2.0-dev:i386, whose
          # i386 archive is frequently a patch version behind the amd64 one
          # already installed on the runner, making apt refuse the install.
          # SDL3 detects libpulse-dev's absence and just disables that backend
          # (ALSA/pipewire still cover audio), so this only costs PulseAudio
          # on the 32-bit build.
          sudo apt-get install -y gcc-multilib g++-multilib \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 libxfixes-dev:i386 libxi-dev:i386 libxss-dev:i386 \
            libxkbcommon-dev:i386 libgl1-mesa-dev:i386 libasound2-dev:i386 libudev-dev:i386 libdbus-1-dev:i386 \
            libwayland-dev:i386 libdecor-0-dev:i386

      - name: Configurar (Linux, 32-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'ON'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCTR_FORCE_32BIT=ON -DCMAKE_C_FLAGS="-m32" -DCMAKE_CXX_FLAGS="-m32" -DCMAKE_EXE_LINKER_FLAGS="-m32"

      - name: Configurar (Linux, 64-bit)
        if: runner.os == 'Linux' && matrix.force32 == 'OFF'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCTR_FORCE_32BIT=OFF

      - name: Compilar (Linux)
        if: runner.os == 'Linux'
        run: cmake --build build -j"$(nproc)"

      - name: Configurar (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -A ${{ matrix.msvc_arch }} -DCTR_FORCE_32BIT=${{ matrix.force32 }}

      - name: Compilar (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release -j

      - name: Ubicar y renombrar el binario compilado
        id: locate
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            src=$(find build -iname "${{ matrix.artifact }}" -path "*Release*" | head -1)
            plat="windows"
            ext=".exe"
          else
            src=$(find build -maxdepth 1 -iname "${{ matrix.artifact }}" | head -1)
            plat="linux"
            ext=""
          fi
          arch="${{ matrix.msvc_arch == 'x64' && 'x86_64' || (matrix.msvc_arch == 'Win32' && 'x86' || (matrix.force32 == 'ON' && 'x86' || 'x86_64')) }}"
          dst="CTR-Fusion-${plat}-${arch}${ext}"
          cp "$src" "$dst"
          echo "path=$dst" >> "$GITHUB_OUTPUT"
          echo "name=$dst" >> "$GITHUB_OUTPUT"

      - name: Publicar binario como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: ${{ steps.locate.outputs.path }}
          if-no-files-found: error

  release:
    name: Publicar release
    needs: [ build-android, build-pc ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do código (para leer as tags existentes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Descargar todos los binarios
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Calcular versión (v1.0, v1.1, ...)
        id: version
        run: |
          # 'v*' also matches older non-semver tags (e.g. v2026.09.09-8e0f1bd
          # from before this scheme), so filter to exactly vMAJOR.MINOR before
          # picking the highest one -- sort -V is version-aware (v1.9 < v1.10).
          last=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$last" ]; then
            next="1.0"
          else
            major=$(echo "${last#v}" | cut -d. -f1)
            minor=$(echo "${last#v}" | cut -d. -f2)
            # 10# forces base-10 so a minor like 09 isn't read as invalid octal.
            next="${major}.$((10#$minor + 1))"
          fi
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Crear GitHub Release combinada (Android + PC)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: CTR Fusion v${{ steps.version.outputs.version }}
          body: |
            Build automática de Android y PC a partir del mismo commit.

            - Commit: `${{ github.sha }}`
            - Android: `armeabi-v7a`, `arm64-v8a`, `x86` (un solo APK, Release)
            - PC: Linux y Windows, `x86` (32-bit) y `x86_64` (64-bit)
          prerelease: false
          make_latest: true
          files: dist/*
